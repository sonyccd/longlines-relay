# Every pull request and every push to main: the Rust core, the window, and a bundle for every
# platform the relay ships on, so a PR proves all three compile and package.
#
# Actions are pinned to commit SHAs; the comment names the release each SHA is.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p relay-core --all-targets --locked -- -D warnings
      - name: Clippy with the OS credential store
        run: cargo clippy -p relay-core --all-targets --features keyring --locked -- -D warnings
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      # Runs the tests under coverage instrumentation, so a failing test fails this step.
      - name: Test
        run: cargo llvm-cov -p relay-core --locked --lcov --output-path lcov.info
      # Pull requests from forks get no secrets; Codecov accepts those uploads without a token
      # on a public repository. An outage at Codecov doesn't fail the build.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: core
          disable_search: true
          fail_ci_if_error: false

  web:
    name: Window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: window
          disable_search: true
          fail_ci_if_error: false
      - name: Build
        run: npm run build

  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
          - name: Windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.args }}
      - run: npm ci
      # Build only: no tagName or releaseId, so nothing is published. The updater artifacts
      # need the signing key, which pull requests don't get, so tauri.ci.conf.json turns them
      # off; the release workflow builds them.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.ci.conf.json -- --locked
          uploadWorkflowArtifacts: true
      # Clippy and the shell's own unit tests (the update path), here because only this job
      # has the WebKitGTK libraries the shell links against.
      - name: Clippy the shell
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo clippy -p longlines-relay --all-targets --locked -- -D warnings
      - name: Test the shell
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test -p longlines-relay --locked
