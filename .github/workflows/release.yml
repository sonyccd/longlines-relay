# A tag vX.Y.Z builds every platform at version X.Y.Z and uploads the bundles and latest.json to
# its release. The tag is the version: each build writes it into the files that carry one, and
# nothing is committed back, so main's version is only a placeholder for local builds.
#
# Pushing the tag from git makes a draft that reaches no one until it is published by hand.
# Publishing a new release on GitHub with a new tag pushes the tag too, and the builds upload to
# that release, which is already public: installed relays find no latest.json until the check
# job passes and keep their next try for the next day. The updater reads
# releases/latest/download/latest.json, and a draft is never "latest". See README "Releasing".
#
# Actions are pinned to commit SHAs; the comment names the release each SHA is.
#
# The updater signing key reaches only the tauri-action step, through the `release` environment
# (README "Updater key"). The window is built in a step before it, so the npm build tools never
# run with the key; Cargo still does, with the lockfile enforced.

name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history, for the check that the tag is on main.
          fetch-depth: 0
          persist-credentials: false
      # Windows installers take only X.Y.Z, with no pre-release or build suffix.
      - name: Check the tag is a version
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} isn't vX.Y.Z."
            exit 1
          fi
      # Only reviewed code is signed: the tagged commit must be on main.
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at a commit that isn't on main."
            exit 1
          fi
      # One job finds the release (made on GitHub) or makes the draft (tag pushed from git), so
      # the four builds upload to the same release instead of each racing to create one.
      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id" | head -n 1)"
          if [ -z "${id}" ]; then
            id="$(gh api "repos/${GITHUB_REPOSITORY}/releases" -X POST \
              -f tag_name="${GITHUB_REF_NAME}" \
              -f name="Long Lines Relay ${GITHUB_REF_NAME}" \
              -f body="Download the file for your computer below. Install steps, including how to open an unsigned app, are in the README." \
              -F draft=true -F prerelease=false --jq .id)"
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    permissions:
      contents: write
    # Holds the signing key; its protection rules decide which refs may use it.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            args: ""
          - name: Windows
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Tauri system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxdo-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      # Every file that carries the app's version gets the tag's (crates/relay-core/tests/
      # versions.rs lists them). tauri.conf.json names the bundles and is what the updater
      # compares; Cargo.toml is what the app reports; Cargo.lock gets the same version for the
      # two workspace crates, so the build can insist on the lockfile.
      - name: Stamp the version from the tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node <<'EOF'
          const fs = require("fs");
          const version = process.env.VERSION;
          for (const file of ["src-tauri/tauri.conf.json", "package.json", "package-lock.json"]) {
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            json.version = version;
            if (file === "package-lock.json") json.packages[""].version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          }
          const cargo = fs.readFileSync("Cargo.toml", "utf8");
          const workspace = /(\[workspace\.package\]\r?\nversion = )"[^"]*"/;
          if (!workspace.test(cargo)) throw new Error("Cargo.toml has no [workspace.package] version line");
          fs.writeFileSync("Cargo.toml", cargo.replace(workspace, `$1"${version}"`));
          let lock = fs.readFileSync("Cargo.lock", "utf8");
          for (const crate of ["relay-core", "longlines-relay"]) {
            const entry = new RegExp(`(\\[\\[package\\]\\]\\r?\\nname = "${crate}"\\r?\\nversion = )"[^"]*"`);
            if (!entry.test(lock)) throw new Error(`Cargo.lock has no ${crate} package`);
            lock = lock.replace(entry, `$1"${version}"`);
          }
          fs.writeFileSync("Cargo.lock", lock);
          console.log(`Stamped version ${version}`);
          EOF
      # Before the signing step, so Vite, tsc and their plugins never run with the key.
      # tauri.release.conf.json drops beforeBuildCommand so tauri build doesn't run it again.
      - name: Build the window
        run: npm run build
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater key (README "Updater key"). Without it the build fails, because
          # tauri.conf.json asks for signed updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # The draft job found or made the release, so the action only uploads to it by id. tauri-action v1
        # writes each latest.json URL as the asset's API address
        # (https://api.github.com/repos/<repo>/releases/assets/<id>), which stays valid when the
        # draft is published; the updater downloads it with Accept: application/octet-stream.
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 1
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json -- --locked

  check:
    name: Check latest.json
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      # Only accounts that can push may read a draft release.
      contents: write
    steps:
      # The four builds each add their platform to latest.json. Fail here, before anyone
      # publishes a draft, if one is missing or points at a file that isn't in this release.
      # tauri-action v1 writes the asset's API URL; a browser download URL is accepted too.
      - name: Every platform is in latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          asset="$(jq -r '.assets[] | select(.name == "latest.json") | .url' release.json)"
          if [ -z "${asset}" ]; then
            echo "::error::The release has no latest.json."
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "${asset}" > latest.json
          cat latest.json
          for platform in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            url="$(jq -r --arg p "${platform}" '.platforms[$p].url // empty' latest.json)"
            sig="$(jq -r --arg p "${platform}" '.platforms[$p].signature // empty' latest.json)"
            if [ -z "${url}" ] || [ -z "${sig}" ]; then
              echo "::error::latest.json has no signed entry for ${platform}. Re-run the failed build job."
              exit 1
            fi
            if ! jq -e --arg u "${url}" \
              'any(.assets[]; .url == $u or .browser_download_url == $u)' release.json > /dev/null; then
              echo "::error::latest.json's ${platform} entry points at ${url}, which isn't a file of this release."
              exit 1
            fi
          done
