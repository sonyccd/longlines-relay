[workspace]
# The Tauri shell (src-tauri) joins this list when it is added; all logic lives in
# crates/relay-core so it builds and tests without the Tauri system libraries.
members = ["crates/relay-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sonyccd/longlines-relay"
