# Codecov (https://about.codecov.io). CI uploads two reports, one per flag: `core` from
# cargo llvm-cov over crates/relay-core, `window` from Vitest over src.
#
# The checks are informational for now: they report on every pull request but never fail one.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

flags:
  core:
    paths:
      - crates/relay-core/
    carryforward: true
  window:
    paths:
      - src/
    carryforward: true

# The fake logger is a development tool, not part of the relay.
ignore:
  - crates/relay-core/src/bin/

comment:
  layout: "condensed_header, diff, flags, files"
  require_changes: true
